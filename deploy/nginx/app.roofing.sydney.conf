# /etc/nginx/sites-available/app.roofing.sydney
#
# Operator CRM. Proxies to the Docker container on loopback.
#
# TLS: run `certbot --nginx -d app.roofing.sydney` AFTER this file is enabled
# and DNS resolves. Certbot injects the listen 443 / ssl_certificate lines and
# the port-80 redirect itself — do not hand-write them here.
#
# ⚠ Verify the upstream port before enabling. This box has a documented history
# of port drift causing 502s:
#     sudo ss -ltnp | grep 9030
#     curl -sS http://127.0.0.1:9030/api/health

upstream roofing_app {
    server 127.0.0.1:9030;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.roofing.sydney;

    # Operator tool — keep it out of search results entirely.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Quote PDFs and site photo uploads.
    client_max_body_size 25m;

    access_log /var/log/nginx/app.roofing.sydney.access.log;
    error_log  /var/log/nginx/app.roofing.sydney.error.log;

    location / {
        proxy_pass http://roofing_app;
        proxy_http_version 1.1;

        # The host split in src/middleware.ts keys off this header — if it is
        # wrong or missing, every request falls through to the public site.
        proxy_set_header Host              $host;

        # Middleware sets this on its own internal rewrite and trusts it to
        # recognise the second pass. Clear anything a client sends so the trust
        # only ever extends to the app's own traffic.
        proxy_set_header X-Crm-Rewrite     "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_buffering       off;
    }

    location /api/health {
        proxy_pass http://roofing_app;
        proxy_set_header Host $host;
        access_log off;
    }
}

# To serve the public site from this container too (i.e. move roofing.sydney off
# Vercel), copy this block with `server_name roofing.sydney www.roofing.sydney;`
# and drop the X-Robots-Tag / X-Frame-Options lines. The same upstream handles
# both — middleware routes on Host.
