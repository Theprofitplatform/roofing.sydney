# /etc/nginx/sites-available/db.roofing.sydney
#
# Public edge for the self-hosted Supabase that lives on `base`
# (Tailscale 100.69.167.68, Kong on :8000). The CRM's browser code calls this
# host directly — NEXT_PUBLIC_SUPABASE_URL points here — so it cannot be
# Tailscale-only, and it cannot be plain HTTP either: app.roofing.sydney is
# served over HTTPS and a page cannot call an http:// endpoint (mixed content).
#
# TLS: run `certbot --nginx -d db.roofing.sydney` AFTER this file is enabled and
# DNS resolves. Certbot injects the listen 443 / ssl_certificate lines and the
# port-80 redirect itself — do not hand-write them here.
#
# ⚠ base is a machine on a home LAN. If it sleeps or loses its link, every CRM
# request that touches the database fails. That is a known, accepted trade-off
# until a cloud project exists (W4) — not a bug to debug when it happens.

upstream supabase_base {
    # Tailscale address of `base`. The Supabase compose override publishes Kong
    # on this address rather than 0.0.0.0, so this is the only way in.
    server 100.69.167.68:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name db.roofing.sydney;

    # A database API has no business in a search index.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Storage uploads: site photos and generated quote PDFs.
    client_max_body_size 50m;

    access_log /var/log/nginx/db.roofing.sydney.access.log;
    error_log  /var/log/nginx/db.roofing.sydney.error.log;

    # ── Only the API surface is public ───────────────────────────────────────
    #
    # Kong also routes `/` to Supabase Studio and `/pg/*` to pg-meta. Studio is
    # protected by nothing but DASHBOARD_PASSWORD basic auth, and pg-meta is a
    # direct line to the schema. Neither belongs on the public internet, so the
    # allow-list below is exhaustive by design: reach Studio over Tailscale at
    # http://100.69.167.68:8000 instead.
    location ~ ^/(auth|rest|realtime|storage|functions)/v1/ {
        proxy_pass http://supabase_base;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Realtime is a websocket; the rest of the API ignores these.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # The hop to base crosses Tailscale, so allow for a slower handshake
        # than a loopback upstream would need.
        proxy_connect_timeout 10s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_buffering       off;
    }

    # Everything else — Studio, /pg/*, probes for stray admin panels.
    location / {
        return 404;
    }
}

# `map` cannot live inside a server block. Defined in nginx.conf's http context
# if not already present:
#     map $http_upgrade $connection_upgrade {
#         default upgrade;
#         ''      close;
#     }
